<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 560" width="1344" height="560" role="img" aria-labelledby="title desc">
  <title id="title">ISS telemetry pipeline architecture</title>
  <desc id="desc">Live ISS position and station telemetry are ingested by a Node.js service into Kafka raw topics, enriched and aggregated by an Apache Flink job into five derived topics, then pushed by a Node.js gateway over WebSocket to an Angular dashboard.</desc>

  <style>
    :root {
      --ink: #0b0b0b; --muted: #6a6a66; --line: #c3c2b7; --hair: #e1e0d9;
      --panel: #ffffff; --panel2: #f4f4f1;
      --accent: #2a78d6; --accent-soft: #eaf1fc;
      --warn: #b8501c; --warn-soft: #fbeee6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f3f3f1; --muted: #9c9c95; --line: #4a4a44; --hair: #33332f;
        --panel: #1e1e1d; --panel2: #171716;
        --accent: #5a9df0; --accent-soft: #14243a;
        --warn: #e8875a; --warn-soft: #2e1d13;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .h  { font-size: 10px; font-weight: 700; letter-spacing: .12em; fill: var(--muted); }
    .n  { font-size: 12.5px; font-weight: 600; }
    .n2 { font-size: 11px; font-weight: 600; }
    .s  { font-size: 10px; }
    .m  { font-size: 9.5px; fill: var(--muted); }
    .xs { font-size: 9px; fill: var(--muted); }
    .ac { fill: var(--accent); }
    .wn { fill: var(--warn); }
    .box   { fill: var(--panel);  stroke: var(--line); stroke-width: 1.5; }
    .inner { fill: var(--panel2); stroke: var(--hair); stroke-width: 1; }
    .flink { fill: var(--panel);  stroke: var(--accent); stroke-width: 2; }
    .topic { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
    .sim   { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
    .dead  { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .edge  { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .edgew { fill: none; stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 5 4; }
    .ahead { fill: var(--line); }
    .aheadw{ fill: var(--warn); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arroww" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aheadw" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="n" x="24" y="34" style="font-size:17px">ISS Live Telemetry Pipeline</text>
  <text class="m" x="24" y="56">Live orbital position and station telemetry, streamed through Kafka, enriched by Apache Flink, delivered to an Angular dashboard.</text>

  <!-- ============ column headers ============ -->
  <text class="h" x="97"   y="112" text-anchor="middle">SOURCES</text>
  <text class="h" x="318"  y="112" text-anchor="middle">INGEST</text>
  <text class="h" x="536"  y="112" text-anchor="middle">KAFKA · RAW</text>
  <text class="h" x="779"  y="112" text-anchor="middle">APACHE FLINK</text>
  <text class="h" x="1032" y="112" text-anchor="middle">KAFKA · DERIVED</text>
  <text class="h" x="1240" y="112" text-anchor="middle">DELIVERY</text>

  <!-- ============ sources ============ -->
  <rect class="box" x="24" y="130" width="146" height="78" rx="8"/>
  <text class="n"  x="97" y="156" text-anchor="middle">wheretheiss.at</text>
  <text class="m"  x="97" y="174" text-anchor="middle">orbital position</text>
  <text class="xs ac" x="97" y="192" text-anchor="middle" style="font-weight:700">LIVE · 1 Hz</text>

  <rect class="dead" x="24" y="236" width="146" height="96" rx="8"/>
  <text class="n"  x="97" y="262" text-anchor="middle">NASA ISSLIVE</text>
  <text class="m"  x="97" y="280" text-anchor="middle">Lightstreamer</text>
  <text class="xs" x="97" y="301" text-anchor="middle">subscribes OK,</text>
  <text class="xs wn" x="97" y="316" text-anchor="middle" style="font-weight:700">publishes nothing</text>

  <!-- ============ ingest ============ -->
  <rect class="box" x="218" y="130" width="200" height="240" rx="10"/>
  <text class="n" x="234" y="156">ingest</text>
  <text class="m" x="402" y="156" text-anchor="end">Node.js</text>

  <rect class="inner" x="234" y="176" width="168" height="42" rx="6"/>
  <text class="s" x="318" y="202" text-anchor="middle">position poller · 1 Hz</text>

  <rect class="inner" x="234" y="230" width="168" height="42" rx="6"/>
  <text class="s" x="318" y="256" text-anchor="middle">telemetry subscriber</text>

  <rect class="sim" x="234" y="288" width="168" height="60" rx="6"/>
  <text class="n2 wn" x="318" y="311" text-anchor="middle">simulator · fallback</text>
  <text class="xs" x="318" y="330" text-anchor="middle">driven by live position</text>

  <!-- position stream drives the simulator -->
  <path class="edge" d="M402 197 C414 197 414 318 404 318" marker-end="url(#arrow)"/>
  <text class="xs" x="398" y="284" text-anchor="end">drives</text>

  <!-- ============ kafka raw ============ -->
  <rect class="box" x="466" y="130" width="140" height="200" rx="10"/>
  <rect class="topic" x="480" y="154" width="112" height="58" rx="6"/>
  <text class="s"  x="536" y="178" text-anchor="middle">iss.position.raw</text>
  <text class="xs" x="536" y="196" text-anchor="middle">1 partition</text>
  <rect class="topic" x="480" y="238" width="112" height="58" rx="6"/>
  <text class="s"  x="536" y="262" text-anchor="middle">iss.telemetry.raw</text>
  <text class="xs" x="536" y="280" text-anchor="middle">3 partitions</text>

  <!-- ============ flink ============ -->
  <rect class="flink" x="654" y="130" width="250" height="330" rx="10"/>
  <text class="n"  x="779" y="156" text-anchor="middle">ISS Live Telemetry Pipeline</text>
  <text class="xs" x="779" y="173" text-anchor="middle">16 tasks · event time · 30 s checkpoints</text>

  <rect class="inner" x="670" y="188" width="218" height="52" rx="6"/>
  <text class="n2" x="779" y="209" text-anchor="middle">PositionEnricher</text>
  <text class="xs" x="779" y="226" text-anchor="middle">keyed · stateful · orbit counting</text>

  <rect class="inner" x="670" y="250" width="218" height="44" rx="6"/>
  <text class="n2" x="779" y="269" text-anchor="middle">side output</text>
  <text class="xs" x="779" y="285" text-anchor="middle">equator · terminator · region</text>

  <rect class="inner" x="670" y="304" width="218" height="44" rx="6"/>
  <text class="n2" x="779" y="323" text-anchor="middle">tumbling windows</text>
  <text class="xs" x="779" y="339" text-anchor="middle">60 s orbital · 30 s per channel</text>

  <rect class="inner" x="670" y="358" width="218" height="44" rx="6"/>
  <text class="n2" x="779" y="377" text-anchor="middle">TelemetryAlerter</text>
  <text class="xs" x="779" y="393" text-anchor="middle">raise after 3 · clear after 5</text>

  <rect class="inner" x="670" y="412" width="218" height="36" rx="6"/>
  <text class="n2" x="779" y="435" text-anchor="middle">ObserverPassDetector</text>

  <!-- ============ kafka derived ============ -->
  <rect class="box" x="952" y="130" width="160" height="330" rx="10"/>
  <rect class="topic" x="966" y="152" width="132" height="50" rx="6"/>
  <text class="s" x="1032" y="182" text-anchor="middle">iss.position.enriched</text>
  <rect class="topic" x="966" y="212" width="132" height="50" rx="6"/>
  <text class="s" x="1032" y="242" text-anchor="middle">iss.orbit.events</text>
  <rect class="topic" x="966" y="272" width="132" height="50" rx="6"/>
  <text class="s" x="1032" y="302" text-anchor="middle">iss.metrics.windowed</text>
  <rect class="topic" x="966" y="332" width="132" height="50" rx="6"/>
  <text class="s" x="1032" y="362" text-anchor="middle">iss.telemetry.stats</text>
  <rect class="topic" x="966" y="392" width="132" height="50" rx="6"/>
  <text class="s" x="1032" y="422" text-anchor="middle">iss.alerts</text>

  <!-- ============ delivery ============ -->
  <rect class="box" x="1160" y="190" width="160" height="100" rx="10"/>
  <text class="n"  x="1240" y="216" text-anchor="middle">gateway</text>
  <text class="m"  x="1240" y="233" text-anchor="middle">Node.js</text>
  <text class="s"  x="1240" y="256" text-anchor="middle">snapshot + deltas</text>
  <text class="xs" x="1240" y="272" text-anchor="middle">coalesced ~2 Hz</text>

  <rect class="box" x="1160" y="330" width="160" height="116" rx="10"/>
  <text class="n"  x="1240" y="356" text-anchor="middle">Angular 18</text>
  <text class="m"  x="1240" y="373" text-anchor="middle">standalone · signals</text>
  <text class="s"  x="1240" y="396" text-anchor="middle">hand-built SVG charts</text>
  <text class="xs" x="1240" y="412" text-anchor="middle">world map baked in</text>
  <text class="xs" x="1240" y="428" text-anchor="middle">no chart libraries</text>

  <!-- ============ edges ============ -->
  <path class="edge"  d="M170 169 L212 169" marker-end="url(#arrow)"/>
  <text class="xs" x="191" y="162" text-anchor="middle">1 Hz</text>

  <path class="edgew" d="M170 272 L212 253" marker-end="url(#arroww)"/>
  <text class="xs wn" x="193" y="292" text-anchor="middle">silent</text>

  <path class="edge"  d="M418 230 L460 230" marker-end="url(#arrow)"/>
  <text class="xs" x="439" y="222" text-anchor="middle">JSON</text>

  <path class="edge"  d="M606 225 L648 225" marker-end="url(#arrow)"/>
  <text class="xs" x="627" y="217" text-anchor="middle">keyed</text>

  <path class="edge"  d="M904 295 L946 295" marker-end="url(#arrow)"/>
  <text class="xs" x="925" y="287" text-anchor="middle">JSON</text>

  <path class="edge"  d="M1112 295 L1154 262" marker-end="url(#arrow)"/>
  <text class="xs" x="1133" y="308" text-anchor="middle">consume</text>

  <path class="edge"  d="M1240 290 L1240 324" marker-end="url(#arrow)"/>
  <text class="xs" x="1250" y="311">WebSocket</text>

  <!-- ============ footnotes ============ -->
  <text class="m" x="24" y="496">Kafka is drawn twice to keep the flow linear — it is one broker (KRaft, no ZooKeeper) holding all seven topics.</text>
  <text class="m" x="24" y="516">Position data is live end to end. The public NASA telemetry feed currently accepts subscriptions but publishes nothing, so ingest</text>
  <text class="m" x="24" y="536">falls back to a simulator driven by the real position stream — and switches back automatically the moment that feed resumes.</text>
</svg>
